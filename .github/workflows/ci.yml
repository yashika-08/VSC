name: Sentinel-VSC CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Lint source
        run: npm run lint

      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies
        # --no-dependencies avoids downloading vscode engine in CI

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-vsc-${{ matrix.node-version }}.vsix
          path: "*.vsix"
          retention-days: 14
